[project]
name = "liturgiestatistiek"
version = "0.1.0"
description = "Liedstatistiek uit de liturgieen van de Westerkerk"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11",
    "PyYAML>=6.0",
    "rapidfuzz>=3.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
liturgiestatistiek = "liturgiestatistiek.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["liturgiestatistiek*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
